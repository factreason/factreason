<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="facetGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="facetGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="facetGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isometric Cube Lattice -->
  <g transform="translate(0, 5)">
    <!-- Top Face -->
    <polygon points="50,12 82,30 50,48 18,30" fill="url(#facetGrad2)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="50,12 50,48 18,30" fill="rgba(56, 189, 248, 0.2)"/>
    <polygon points="50,12 82,30 50,48" fill="rgba(255, 255, 255, 0.15)"/>

    <!-- Left Face with Facets -->
    <polygon points="18,30 50,48 50,84 18,66" fill="url(#facetGrad1)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
    <polyline points="18,30 34,57 50,84" stroke="#0ea5e9" stroke-width="1" fill="none" opacity="0.6"/>
    <polyline points="18,66 34,57 50,48" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Right Face with Facets -->
    <polygon points="50,48 82,30 82,66 50,84" fill="url(#facetGrad3)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
    <polyline points="50,48 66,57 82,66" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.6"/>
    <polyline points="82,30 66,57 50,84" stroke="#0ea5e9" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Glowing Verification Checkmark -->
    <path d="M 28,46 L 46,65 L 86,22" 
          fill="none" 
          stroke="url(#checkGrad)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glow)"/>
    <path d="M 28,46 L 46,65 L 86,22" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
