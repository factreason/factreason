name: Publish to MCP Registry

on:
  push:
    branches: ["main"]
    paths:
      - "server.json"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry via OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          OUTPUT=$(./mcp-publisher publish server.json 2>&1) || {
            if echo "$OUTPUT" | grep -q "cannot publish duplicate version"; then
              echo "Version in server.json is already published to the MCP registry. Skipping."
              exit 0
            fi
            echo "$OUTPUT"
            exit 1
          }
